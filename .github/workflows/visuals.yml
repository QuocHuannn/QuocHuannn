name: Generate profile visuals

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  contrib3d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: QuocHuannn

      - name: Generate static night-view variant
        run: |
          python3 - <<'EOF'
          import re
          s = open('profile-3d-contrib/profile-night-view.svg').read()
          s = re.sub(r'<animate[^>]*/>', '', s)
          s = re.sub(r'<animate[^>]*></animate>', '', s)
          s = re.sub(r'<animateTransform[^>]*/>', '', s)
          s = re.sub(r'<animateTransform[^>]*></animateTransform>', '', s)
          open('profile-3d-contrib/profile-night-view-static.svg','w').write(s)
          EOF

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pacman:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: QuocHuannn
          outputs: |
            dist/pacman-contribution-graph.svg?pacman
            dist/pacman-contribution-graph-dark.svg?pacman&palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
