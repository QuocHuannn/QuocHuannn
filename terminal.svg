<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460">
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; font-size: 14px; }
  </style>

  <!-- window -->
  <rect x="4" y="4" width="752" height="452" rx="12" fill="#1a1b27" stroke="#2a2e42"/>
  <circle cx="30" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="24" r="6" fill="#febc2e"/>
  <circle cx="70" cy="24" r="6" fill="#28c840"/>
  <text x="380" y="29" text-anchor="middle" font-size="12" fill="#565f89">huan@ventra-rocket ~</text>
  <line x1="4" y1="40" x2="756" y2="40" stroke="#2a2e42"/>

  <!-- typing masks -->
  <clipPath id="t0"><rect x="28" y="52" height="22" width="0">
    <animate attributeName="width" from="0" to="80" dur="0.6s" begin="0.4s" fill="freeze"/>
  </rect></clipPath>
  <clipPath id="t1"><rect x="28" y="132" height="22" width="0">
    <animate attributeName="width" from="0" to="125" dur="0.9s" begin="1.7s" fill="freeze"/>
  </rect></clipPath>
  <clipPath id="t2"><rect x="28" y="234" height="22" width="0">
    <animate attributeName="width" from="0" to="140" dur="1s" begin="4.5s" fill="freeze"/>
  </rect></clipPath>
  <clipPath id="t3"><rect x="28" y="336" height="22" width="0">
    <animate attributeName="width" from="0" to="160" dur="1.1s" begin="6.5s" fill="freeze"/>
  </rect></clipPath>

  <!-- $ whoami -->
  <g clip-path="url(#t0)">
    <text x="28" y="70"><tspan fill="#a78bfa">$</tspan><tspan fill="#c0caf5"> whoami</tspan></text>
  </g>
  <text x="28" y="94" opacity="0"><tspan fill="#7aa2f7">Tr&#x1B0;&#x1A1;ng Qu&#x1ED1;c Hu&#xE2;n</tspan><tspan fill="#a9b1d6"> — fullstack engineer</tspan>
    <set attributeName="opacity" to="1" begin="1.1s" fill="freeze"/></text>
  <text x="28" y="118" fill="#a9b1d6" opacity="0">builder @ ventra rocket &#xB7; hcmc, vietnam
    <set attributeName="opacity" to="1" begin="1.18s" fill="freeze"/></text>

  <!-- $ ls shipped/ -->
  <g clip-path="url(#t1)">
    <text x="28" y="150"><tspan fill="#a78bfa">$</tspan><tspan fill="#c0caf5"> ls shipped/</tspan></text>
  </g>
  <text x="28" y="174" opacity="0"><tspan fill="#7dcfff">echoseo/</tspan><tspan fill="#565f89">    open-core semrush/ahrefs alternative &#xB7; verified audits &#xB7; mcp-native</tspan>
    <set attributeName="opacity" to="1" begin="2.75s" fill="freeze"/></text>
  <text x="28" y="196" opacity="0"><tspan fill="#bb9af7">kello/</tspan><tspan fill="#565f89">       luxury-watch data api + consumer hub &#xB7; nuxt &#xB7; laravel</tspan>
    <set attributeName="opacity" to="1" begin="2.83s" fill="freeze"/></text>
  <text x="28" y="218" opacity="0"><tspan fill="#7aa2f7">speakhub/</tspan><tspan fill="#565f89">    english club platform &#xB7; booking &#xB7; payos &#xB7; ai assessment</tspan>
    <set attributeName="opacity" to="1" begin="2.91s" fill="freeze"/></text>

  <!-- $ stack --all -->
  <g clip-path="url(#t2)">
    <text x="28" y="252"><tspan fill="#a78bfa">$</tspan><tspan fill="#c0caf5"> stack --all</tspan></text>
  </g>
  <text x="28" y="276" opacity="0"><tspan fill="#565f89">langs  </tspan><tspan fill="#a9b1d6">typescript &#xB7; go &#xB7; python &#xB7; php</tspan>
    <set attributeName="opacity" to="1" begin="5.65s" fill="freeze"/></text>
  <text x="28" y="298" opacity="0"><tspan fill="#565f89">ui     </tspan><tspan fill="#a9b1d6">react &#xB7; next.js &#xB7; vue/nuxt &#xB7; tailwind</tspan>
    <set attributeName="opacity" to="1" begin="5.73s" fill="freeze"/></text>
  <text x="28" y="320" opacity="0"><tspan fill="#565f89">ops    </tspan><tspan fill="#a9b1d6">postgres &#xB7; redis &#xB7; docker &#xB7; k8s &#xB7; cloudflare workers</tspan>
    <set attributeName="opacity" to="1" begin="5.81s" fill="freeze"/></text>

  <!-- $ cat contact.txt -->
  <g clip-path="url(#t3)">
    <text x="28" y="354"><tspan fill="#a78bfa">$</tspan><tspan fill="#c0caf5"> cat contact.txt</tspan></text>
  </g>
  <text x="28" y="378" opacity="0"><tspan fill="#565f89">mail   </tspan><tspan fill="#a9b1d6">truonghuan0709@gmail.com</tspan>
    <set attributeName="opacity" to="1" begin="7.75s" fill="freeze"/></text>
  <text x="28" y="400" opacity="0"><tspan fill="#565f89">in     </tspan><tspan fill="#a9b1d6">linkedin.com/in/truong-quoc-huan-325669319</tspan>
    <set attributeName="opacity" to="1" begin="7.83s" fill="freeze"/></text>

  <!-- final prompt + blinking cursor -->
  <text x="28" y="436" opacity="0"><tspan fill="#a78bfa">$</tspan>
    <set attributeName="opacity" to="1" begin="8.4s" fill="freeze"/></text>
  <rect x="45" y="423" width="9" height="16" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" begin="8.4s" repeatCount="indefinite"/>
  </rect>
</svg>
