<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340">
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'Fira Code', Consolas, monospace; font-size: 14px; }
  </style>

  <!-- window -->
  <rect x="4" y="4" width="752" height="332" rx="12" fill="#1a1b27" stroke="#2a2e42"/>
  <circle cx="30" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="24" r="6" fill="#febc2e"/>
  <circle cx="70" cy="24" r="6" fill="#28c840"/>
  <text x="380" y="29" text-anchor="middle" font-size="12" fill="#565f89">huan@ventra-rocket ~</text>
  <line x1="4" y1="40" x2="756" y2="40" stroke="#2a2e42"/>

  <!-- typing masks: width grows -> chars appear (monospace cells) -->
  <clipPath id="t0"><rect x="28" y="58" height="18" width="0">
    <animate attributeName="width" from="0" to="80" dur="0.7s" begin="0.4s" fill="freeze"/>
  </rect></clipPath>
  <clipPath id="t1"><rect x="28" y="139" height="18" width="0">
    <animate attributeName="width" from="0" to="125" dur="1s" begin="1.7s" fill="freeze"/>
  </rect></clipPath>
  <clipPath id="t2"><rect x="28" y="195" height="18" width="0">
    <animate attributeName="width" from="0" to="160" dur="1.2s" begin="3.5s" fill="freeze"/>
  </rect></clipPath>

  <!-- $ whoami -->
  <g clip-path="url(#t0)">
    <text x="28" y="72"><tspan fill="#a78bfa">$</tspan><tspan fill="#c0caf5"> whoami</tspan></text>
  </g>
  <text x="28" y="96" opacity="0"><tspan fill="#7aa2f7">Tr&#x1B0;&#x1A1;ng Qu&#x1ED1;c Hu&#xE2;n</tspan><tspan fill="#a9b1d6"> — fullstack engineer</tspan>
    <set attributeName="opacity" to="1" begin="1.2s" fill="freeze"/></text>
  <text x="28" y="120" fill="#a9b1d6" opacity="0">builder @ ventra rocket &#xB7; hcmc, vietnam
    <set attributeName="opacity" to="1" begin="1.28s" fill="freeze"/></text>

  <!-- $ ls shipped/ -->
  <g clip-path="url(#t1)">
    <text x="28" y="152"><tspan fill="#a78bfa">$</tspan><tspan fill="#c0caf5"> ls shipped/</tspan></text>
  </g>
  <text x="28" y="176" opacity="0"><tspan fill="#7dcfff">echoseo/</tspan><tspan fill="#565f89">   </tspan><tspan fill="#bb9af7">kello/</tspan><tspan fill="#565f89">   </tspan><tspan fill="#7aa2f7">speakhub/</tspan>
    <set attributeName="opacity" to="1" begin="2.85s" fill="freeze"/></text>

  <!-- $ cat contact.txt -->
  <g clip-path="url(#t2)">
    <text x="28" y="208"><tspan fill="#a78bfa">$</tspan><tspan fill="#c0caf5"> cat contact.txt</tspan></text>
  </g>
  <text x="28" y="232" opacity="0"><tspan fill="#565f89">mail  </tspan><tspan fill="#a9b1d6">truonghuan0709@gmail.com</tspan>
    <set attributeName="opacity" to="1" begin="4.85s" fill="freeze"/></text>
  <text x="28" y="256" opacity="0"><tspan fill="#565f89">in    </tspan><tspan fill="#a9b1d6">linkedin.com/in/truong-quoc-huan-325669319</tspan>
    <set attributeName="opacity" to="1" begin="4.93s" fill="freeze"/></text>

  <!-- final prompt + blinking cursor -->
  <text x="28" y="292" opacity="0"><tspan fill="#a78bfa">$</tspan>
    <set attributeName="opacity" to="1" begin="5.5s" fill="freeze"/></text>
  <rect x="45" y="279" width="9" height="16" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" begin="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
